name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/requirements.txt
      - name: System libraries for OpenCASCADE / gmsh
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libxrender1 libxcursor1 \
            libxft2 libxinerama1 libxi6 libxkbcommon0 libfontconfig1 libgomp1
      - name: Install
        run: pip install -r deploy/requirements.txt pytest matplotlib
      - name: Download trained models and samples
        run: python tools/download_models.py --samples
      - name: Tests
        run: python -m pytest -q
