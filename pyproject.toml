[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enginelab"
version = "0.1.0"
description = "Break CAD assemblies into parts, identify and measure them, recommend materials, test parts and simulate engine life."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy Bareh" }, { name = "Aaron" }]
keywords = ["cad", "step", "solidworks", "engine", "robotics", "fea", "fatigue", "machine-learning", "bom", "urdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Manufacturing",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn==1.8.0",   # the released models are pickled with this version
  "joblib>=1.3",
  "trimesh>=4.0",
  "manifold3d>=3.0",
  "rtree>=1.2",
  "shapely>=2.0",
  "networkx>=3.0",
  "lxml>=5.0",
  "gmsh>=4.12",
  "cadquery-ocp>=7.7",
  "pyamg>=5.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "pillow>=10.0",
  "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
hosted = ["huggingface_hub>=0.24"]

[project.urls]
Homepage = "https://github.com/jeremygideonbareh/enginelab"
Issues = "https://github.com/jeremygideonbareh/enginelab/issues"
Changelog = "https://github.com/jeremygideonbareh/enginelab/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["enginelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
